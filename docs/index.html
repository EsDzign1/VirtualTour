    <script>
      // Ensure trailing slash on GitHub Pages directory URLs so relative paths (./assets/...) resolve properly
      if (
        window.location.pathname &&
        !window.location.pathname.endsWith('/') &&
        !window.location.pathname.split('/').pop().includes('.')
      ) {
        window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
      }
    </script>
    <script type="module" crossorigin src="./assets/index-D0D9m4zf.js"></script>

  <body style="margin: 0; background-color: #0a0a0a;">
    <div id="root"></div>
    <script>
      // If deployed to GitHub Pages root directly with uncompiled src/main.tsx, redirect to the prebuilt /docs/ bundle
      (function() {
        if (
          window.location.hostname.endsWith('github.io') &&
          !window.location.pathname.includes('/docs')
        ) {
          var isSourceHtml = document.querySelector('script[src*="src/main.tsx"]');
          if (isSourceHtml) {
            var basePath = window.location.pathname.replace(/\/+$/, '');
            window.location.replace(basePath + '/docs/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
  </body>
